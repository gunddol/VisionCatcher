name: Validate and deploy static website

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visioncatcher-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate static files
        run: bash scripts/validate-site.sh

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Upload website to S3
        run: |
          aws s3 sync . "s3://${{ vars.S3_BUCKET_NAME }}" \
            --delete \
            --cache-control "public,max-age=300" \
            --exclude "*" \
            --include "*.html" \
            --include "*.css" \
            --include "*.js" \
            --include "robots.txt" \
            --include "sitemap.xml" \
            --include "assets/*"

      - name: Prevent HTML from becoming stale
        run: |
          for file in ./*.html; do
            aws s3 cp "$file" "s3://${{ vars.S3_BUCKET_NAME }}/$(basename "$file")" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "no-cache, max-age=0, must-revalidate"
          done

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

